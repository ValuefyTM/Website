<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ece0">
<title>Căutare cadastrală · VALUEFY</title>
<meta name="description" content="Caută un număr cadastral și vezi conturul pe hartă, inventarul de coordonate Stereo 70 / GPS și vecinii. VALUEFY — evaluări imobiliare autorizate ANEVAR.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: bară VALUEFY sus · panou fișă (stânga, desktop) + hartă; pe telefon hartă sus și fișa dedesubt, pagina derulează normal */
:root{
  --navy:#17173a; --navy-deep:#111130; --navy-hover:#24245a; --ink:#17173a; --muted:#626771; --muted-2:#4a4a66;
  --acc:#f2a93b; --acc-ink:#e0931a; --acc-soft:#fdf1dc; --acc-text:#9a5f00;
  --white:#ffffff; --cream:#fbf8f2; --cream-deep:#f7f1e4; --gray-bg:#f7f8fa; --line:#e7e9ed; --line-warm:#ede6d8; --header-bg:#f2ece0;
  --danger-soft:#fdecea; --danger-text:#a4281e;
  --sans:Verdana,Geneva,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --hdr:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--white);color:var(--ink);font:14px/1.55 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc-text)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 20px 0;background:var(--header-bg);border-bottom:1px solid var(--line-warm);display:flex;align-items:center;gap:16px;position:relative;z-index:1000}
.top .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.top .logo img{height:26px;width:auto;display:block}
.top .logo span{font-size:12px;color:var(--muted);border-left:1px solid var(--line-warm);padding-left:12px;white-space:nowrap}
.top .cta{margin-left:auto;background:var(--acc);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:9px 16px;white-space:nowrap;transition:background .25s var(--ease)}
.top .cta:hover{background:var(--acc-ink)}

.app{display:grid;grid-template-columns:420px 1fr;grid-template-rows:auto 1fr auto;height:calc(100% - var(--hdr) - env(safe-area-inset-top,0px))}
aside{display:contents}
.find,main,.note{grid-column:1;border-right:1px solid var(--line);background:var(--white)}
.find{grid-row:1}main{grid-row:2}.note{grid-row:3}
.mapwrap{grid-column:2;grid-row:1/-1}
#map{min-width:0;min-height:0;background:var(--navy)}

.find{padding:18px 20px 16px;background-image:linear-gradient(var(--cream),var(--cream-deep));border-bottom:1px solid var(--line-warm);display:grid;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-text);margin:0}
.find h1{font-size:22px;line-height:1.15;letter-spacing:-.035em;margin:0;text-wrap:balance}
.row{display:flex;gap:8px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
select,input{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:0 12px;min-width:0}
input{font:700 17px var(--mono);letter-spacing:.02em}
#uatSel{width:132px}
.field.grow{flex:1}
.btn{height:46px;border-radius:12px;border:0;background:var(--acc);color:var(--ink);font-weight:700;padding:0 18px;cursor:pointer;transition:background .25s var(--ease)}
.btn:hover{background:var(--acc-ink)}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:700;font-size:13px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:border-color .25s var(--ease)}
.btn2:hover{border-color:var(--acc)}
.btn2.navy{background:var(--navy);border-color:var(--navy);color:#f4f5f7}
.btn2.navy:hover{background:var(--navy-hover)}
#sugg{display:flex;flex-wrap:wrap;gap:6px}
#sugg:empty{display:none}
.chip{border:1px solid var(--line-warm);background:var(--white);border-radius:999px;font:700 12px var(--mono);padding:6px 10px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);margin:0}

main{overflow:auto;padding:18px 20px 24px;display:grid;gap:18px;align-content:start;min-height:0}
.empty{color:var(--muted-2);margin:0}
.idrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.idrow .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.idrow .id{font:800 28px var(--mono);letter-spacing:.01em;line-height:1.1}
.pill{background:var(--navy);color:#f4f5f7;border-radius:999px;font-size:12px;font-weight:700;padding:5px 11px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--cream);border:1px solid var(--line-warm);border-radius:10px;padding:9px 11px;min-width:0}
.facts small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.facts b{display:block;font:800 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.flag{background:var(--danger-soft);color:var(--danger-text);border-radius:10px;padding:10px 12px;font-size:12.5px}
.flag .chip{margin:4px 4px 0 0}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-text);margin:0 0 8px}
.seg{display:inline-flex;background:var(--gray-bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(23,23,58,.15)}
.tabs{margin:0;justify-self:start}
input.txt{font:400 15px var(--sans);letter-spacing:0}
#rad{width:96px}
.near{display:grid;gap:6px}
.near button{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px 12px;cursor:pointer;font:12.5px var(--mono);font-variant-numeric:tabular-nums;min-height:44px}
.near button:hover{border-color:var(--acc)}
.near button.here{background:var(--acc-soft);border-color:var(--acc)}
.near b{font-weight:800;font-size:14px}
.near span{color:var(--muted)}
.loc{background:var(--cream);border:1px solid var(--line-warm);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.loc b{font-size:14px}
.loc small{font:12px var(--mono);color:var(--muted)}
.back{justify-self:start;background:none;border:0;color:var(--acc-text);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:700 11px var(--sans);color:var(--muted);background:var(--gray-bg)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:center}
td:first-child{font-weight:800}
tfoot td{background:var(--cream);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn2{justify-content:center}
.nb{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));margin:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(23,23,58,.35);color:#fff;font-weight:700;z-index:900}
.mapwrap{position:relative;min-width:0;min-height:0}
.mapwrap #map{position:absolute;inset:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#f4f5f7;padding:10px 16px;border-radius:12px;font-size:13px;z-index:2000;box-shadow:0 14px 30px -14px rgba(23,23,58,.5);max-width:calc(100% - 32px)}
.vx{font:800 11px var(--mono);color:var(--ink);background:var(--acc);border:1.5px solid var(--navy);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
.leaflet-tooltip.pl{font:700 12px var(--mono);color:var(--ink)}
.leaflet-container{font-family:var(--sans)}
.leaflet-bar a{color:var(--ink)}

@media (max-width:820px){
  :root{--hdr:56px}
  .top{padding-inline:16px;gap:10px}
  .top .logo img{height:22px}
  .top .logo span{display:none}
  .top .cta{padding:8px 12px;font-size:12px}
  html,body{height:auto}
  .app{display:block;height:auto}
  .find,main,.note{border-right:0}
  .find{padding:14px 16px;gap:10px}
  .find h1{font-size:19px}
  #uatSel{width:112px}
  .mapwrap{height:52svh;min-height:300px}
  main{overflow:visible;padding:16px 16px 20px}
  .note{padding-inline:16px}
  .actions{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
  .facts{grid-template-columns:1fr 1fr}
  .facts div:last-child{grid-column:1/-1}
  .actions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="https://valuefy.ro" aria-label="VALUEFY — pagina principală"><img src="/valuefy-logo.png" alt="VALUEFY" width="480" height="98"><span>Căutare cadastrală</span></a>
</header>

<div class="app">
  <aside>
    <form class="find" id="f" autocomplete="off">
      <p class="eyebrow">Hartă cadastrală · Timiș</p>
      <h1>Găsește un imobil după număr cadastral sau adresă.</h1>
      <div class="seg tabs" role="tablist" aria-label="Tip căutare"><button type="button" role="tab" id="tabCad" aria-pressed="true">Nr. cadastral</button><button type="button" role="tab" id="tabAdr" aria-pressed="false">Adresă / coordonate</button></div>
      <div class="row" id="modeCad">
        <div class="field"><label for="uatSel">UAT</label><select id="uatSel"></select></div>
        <div class="field grow"><label for="q">Nr. cadastral</label><input id="q" inputmode="numeric" enterkeyhint="search" placeholder="ex. 405306"></div>
      </div>
      <div class="row" id="modeAdr" hidden>
        <div class="field grow"><label for="addr">Adresă, coordonate sau link Google Maps</label><input id="addr" class="txt" enterkeyhint="search" placeholder="ex. Str. Aron Gabor, Dumbrăvița"></div>
        <div class="field"><label for="rad">Rază</label><select id="rad"><option value="50">50 m</option><option value="100" selected>100 m</option><option value="250">250 m</option></select></div>
      </div>
      <button class="btn" type="submit">Caută →</button>
      <div id="sugg"></div>
      <p class="hint" id="hint">Sau atinge o parcelă pe hartă.</p>
    </form>
    <div class="mapwrap"><div id="map" role="region" aria-label="Hartă"></div><div class="loading" id="load" hidden>Se încarcă…</div></div>
    <main id="out" aria-live="polite"><p class="empty">Alege UAT-ul și introdu numărul cadastral din extrasul CF. Vezi conturul pe imaginea satelit, inventarul de coordonate și vecinii.</p></main>
    <p class="note" id="foot"></p>
  </aside>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Stereo 70 (EPSG:31700, stereografic dublu pe Krasovski) -> WGS84, Helmert 7 parametri (convenția PROJ towgs84). */
const S70=(()=>{
  const D=Math.PI/180, a=6378245, f=1/298.3, e2=2*f-f*f, e=Math.sqrt(e2);
  const lat0=46*D, lon0=25*D, k0=0.99975, FE=500000, FN=500000;
  const s0=Math.sin(lat0), c0=Math.cos(lat0);
  const rho0=a*(1-e2)/Math.pow(1-e2*s0*s0,1.5), nu0=a/Math.sqrt(1-e2*s0*s0), R=Math.sqrt(rho0*nu0);
  const n=Math.sqrt(1+e2*Math.pow(c0,4)/(1-e2));
  const S1=(1+s0)/(1-s0), S2=(1-e*s0)/(1+e*s0), w1=Math.pow(S1*Math.pow(S2,e),n);
  const sx0=(w1-1)/(w1+1), c=(n+s0)*(1-sx0)/((n-s0)*(1+sx0)), w2=c*w1, chi0=Math.asin((w2-1)/(w2+1));
  const g=2*R*k0*Math.tan(Math.PI/4-chi0/2), h=4*R*k0*Math.tan(chi0)+g;
  const T=[2.329,-147.042,-92.08], rs=[-0.309,0.325,0.497].map(x=>x/3600*D), sc=1+5.69e-6;
  const A=6378137, F=1/298.257223563, E2=2*F-F*F, B=A*(1-F), EP2=(A*A-B*B)/(B*B);
  /* E = Y Stereo (est), N = X Stereo (nord) */
  return function(E,N){
    const dE=E-FE, dN=N-FN;
    const i=Math.atan(dE/(h+dN)), j=Math.atan(dE/(g-dN))-i;
    const chi=chi0+2*Math.atan((dN-dE*Math.tan(j/2))/(2*R*k0));
    const Lam=j+2*i+lon0, lon=(Lam-lon0)/n+lon0;
    const sc_=Math.sin(chi), psi=0.5*Math.log((1+sc_)/(c*(1-sc_)))/n;
    let phi=2*Math.atan(Math.exp(psi))-Math.PI/2;
    for(let k=0;k<10;k++){const sp=Math.sin(phi);
      const psii=Math.log(Math.tan(phi/2+Math.PI/4)*Math.pow((1-e*sp)/(1+e*sp),e/2));
      const nx=phi-(psii-psi)*Math.cos(phi)*(1-e2*sp*sp)/(1-e2); if(Math.abs(nx-phi)<1e-14){phi=nx;break} phi=nx}
    const sp=Math.sin(phi), cp=Math.cos(phi), Nn=a/Math.sqrt(1-e2*sp*sp);
    const X=Nn*cp*Math.cos(lon), Y=Nn*cp*Math.sin(lon), Z=Nn*(1-e2)*sp;
    const [rx,ry,rz]=rs;
    const X2=T[0]+sc*(X-rz*Y+ry*Z), Y2=T[1]+sc*(rz*X+Y-rx*Z), Z2=T[2]+sc*(-ry*X+rx*Y+Z);
    const p=Math.hypot(X2,Y2), th=Math.atan2(Z2*A,p*B);
    const lat=Math.atan2(Z2+EP2*B*Math.pow(Math.sin(th),3), p-E2*A*Math.pow(Math.cos(th),3));
    return [lat/D, Math.atan2(Y2,X2)/D];
  };
})();
</script>

L.control.scale({imperial:false}).addTo(map);

const hullL=L.layerGroup().addTo(map);
function drawHulls(){
  hullL.clearLayers();
  UATS.forEach(u=>{if(U&&U.key===u.key)return;
    const h=L.polygon(u.hull,{color:'#f2a93b',weight:U?1.2:2,dashArray:U?'4 6':null,fillColor:'#17173a',fillOpacity:U?0:.25});
    h.bindTooltip(u.name+(U?'':' · '+u.n.toLocaleString('ro-RO')+' imobile'),{sticky:true,className:'pl'});
    h.on('click',async()=>{lastNear=null;locLayer.clearLayers();await loadUat(u.key);history.replaceState(null,'','#'+u.key)});
    h.addTo(hullL)});
}
const cache={}; let U=null, P=[], byId=new Map(), ids=[], cur=null, mode='s';
$('uatSel').add(new Option('Alege…',''));UATS.forEach(u=>$('uatSel').add(new Option(u.name,u.key)));

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2000)}

async function getData(u){
  if(cache[u.key])return cache[u.key];
  try{
    const D=await fetch(u.file).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    D.parcels.forEach((p,i)=>{p.i=i;if(!p.w)p.w=p.s.map(s=>{const r=S70(s[0],s[1]);return[+r[0].toFixed(7),+r[1].toFixed(7)]});
      let a=90,b=180,c=-90,d=-180;p.w.forEach(w=>{a=Math.min(a,w[0]);b=Math.min(b,w[1]);c=Math.max(c,w[0]);d=Math.max(d,w[1])});p.bb=[a,b,c,d]});
    return cache[u.key]=D;
  }catch(e){return null}
}
async function loadUat(key){
  const u=UATS.find(x=>x.key===key); 
  if(!u){$('uatSel').value='';return}
  $('uatSel').value=u.key;
  if(U&&U.key===u.key)return;
  $('load').hidden=false;
  const D=await getData(u);
  if(!D){$('load').hidden=true;$('out').innerHTML='<p class="flag">Datele pentru '+esc(u.name)+' nu s-au putut încărca. Reîncarcă pagina.</p>';return}
  U={...u,src:D.src};
  P=D.parcels; byId=new Map(); P.forEach((p,i)=>{(byId.get(p.id)||byId.set(p.id,[]).get(p.id)).push(p)});
  ids=[...byId.keys()].sort();
  all.clearLayers(); sel.clearLayers(); cur=null;
  const base={color:'#ffffff',weight:.8,opacity:.7,fillOpacity:0};
  const ls=P.map(p=>{const l=L.polygon(p.w,base);l.bindTooltip(p.id,{className:'pl',sticky:true,direction:'top'});l.on('click',()=>{$('q').value=p.id;show(p.id,p.i,true)});l.addTo(all);return l});
  map.fitBounds(L.featureGroup(ls).getBounds(),{animate:false});
  drawHulls();
  $('hint').textContent=byId.size.toLocaleString('ro-RO')+' imobile în '+u.name+'. Sau atinge o parcelă pe hartă.';
  $('foot').textContent='Sursă: plan cadastral (strat ImobileE3), UAT '+u.name+'. Coordonatele Stereo 70 sunt cele din planul cadastral; cele GPS (WGS84) sunt calculate, cu o precizie de aproximativ 1–3 m. Informațiile au caracter orientativ și nu înlocuiesc extrasul de carte funciară sau documentația cadastrală.';
  $('out').innerHTML='<p class="empty">Introdu numărul cadastral din extrasul CF pentru '+esc(u.name)+'.</p>';
  $('load').hidden=true;
}

/* ---------- Căutare după adresă / coordonate ---------- */
let searchMode='cad', lastNear=null; const locLayer=L.layerGroup().addTo(map);
function parseCoords(s){
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/^\s*(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,3}[.,]\d+)\s*$/);
  if(!m)return null; const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[2].replace(',','.'));
  return (a>43&&a<49&&b>20&&b<30)?[a,b]:null;
}
async function geocode(s){
  const out=[];
  try{
    const r=await fetch('https://photon.komoot.io/api/?limit=6&lat=45.75&lon=21.23&bbox=20.2,45.2,22.7,46.3&q='+encodeURIComponent(s));
    const j=await r.json();
    (j.features||[]).forEach(f=>{const p=f.properties||{};const c=f.geometry.coordinates;
      const lab=[[p.street||p.name,p.housenumber].filter(Boolean).join(' '),p.city||p.town||p.village||p.county].filter(Boolean).join(', ');
      if(c[1]>45.2&&c[1]<46.3&&c[0]>20.2&&c[0]<22.7)out.push({lat:c[1],lng:c[0],label:lab||p.name||s})});
  }catch(e){}
  if(!out.length){try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ro&viewbox=20.2,46.3,22.7,45.2&bounded=1&q='+encodeURIComponent(s));
    (await r.json()).forEach(x=>out.push({lat:+x.lat,lng:+x.lon,label:x.display_name.split(',').slice(0,3).join(',')}));
  }catch(e){}}
  return out;
}
async function addrSearch(s){
  if(!s)return;
  const c=parseCoords(s);
  if(c)return goToPoint(c[0],c[1],'Coordonate '+c[0].toFixed(6)+', '+c[1].toFixed(6),[]);
  $('out').innerHTML='<p class="empty">Caut adresa…</p>';
  const res=await geocode(s);
  if(!res.length){$('out').innerHTML='<div class="flag">Nu am găsit adresa „'+esc(s)+'”. Încearcă doar strada și localitatea (fără număr), sau lipește coordonatele / link-ul locației din Google Maps.</div>';return}
  goToPoint(res[0].lat,res[0].lng,res[0].label,res);
}
const inBB=(bb,la,lo,m)=>la>=bb[0]-m&&la<=bb[2]+m&&lo>=bb[1]-m&&lo<=bb[3]+m;
function distM(p,la,lo){ // 0 dacă punctul e în parcelă, altfel distanța minimă la contur, în metri
  const kx=Math.cos(la*Math.PI/180)*111320,ky=110540, pts=p.w.map(w=>[(w[1]-lo)*kx,(w[0]-la)*ky]);
  let inside=false,dmin=Infinity;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if(((yi>0)!==(yj>0))&&(0<(xj-xi)*(0-yi)/(yj-yi)+xi))inside=!inside;
    const dx=xj-xi,dy=yj-yi,l2=dx*dx+dy*dy;let t=l2?-(xi*dx+yi*dy)/l2:0;t=Math.max(0,Math.min(1,t));dmin=Math.min(dmin,Math.hypot(xi+t*dx,yi+t*dy))}
  return inside?0:dmin;
}
async function goToPoint(la,lo,label,alts){
  locLayer.clearLayers(); sel.clearLayers();
  const cands=UATS.filter(u=>inBB(u.bb,la,lo,0.002)); let u=null,bd=Infinity;
  if(cands.length>1||(cands.length&&!cache[cands[0].key]))$('load').hidden=false;
  for(const c of cands){const D=await getData(c);if(!D)continue;
    for(const p of D.parcels){if(!inBB(p.bb,la,lo,0.004))continue;const d=distM(p,la,lo);if(d<bd){bd=d;u=c}}}
  $('load').hidden=true;
  const R=+$('rad').value;
  L.circle([la,lo],{radius:R,color:'#ffffff',weight:2,dashArray:'5 5',fill:false,interactive:false}).addTo(locLayer);
  L.circleMarker([la,lo],{radius:8,color:'#17173a',weight:3,fillColor:'#f2a93b',fillOpacity:1,interactive:false}).addTo(locLayer);
  if(!u){lastNear=null;map.setView([la,lo],17,{animate:false});
    $('out').innerHTML='<div class="loc"><b>'+esc(label)+'</b><small>'+la.toFixed(6)+', '+lo.toFixed(6)+'</small></div><div class="flag">Locația e în afara UAT-urilor disponibile ('+UATS.map(u=>u.name).join(', ')+').</div>';return}
  await loadUat(u.key);
  const dm=R/90000, near=[];
  P.forEach(p=>{if(!inBB(p.bb,la,lo,dm))return;const d=distM(p,la,lo);if(d<=R)near.push({p,d})});
  near.sort((a,b)=>a.d-b.d||a.p.a-b.p.a);
  lastNear={lat:la,lng:lo,label,alts:alts||[],near,uat:u.name,ids:new Set(near.map(n=>n.p.id))};
  renderNear(); scrollToMap();
}
function renderNear(){
  const N=lastNear; if(!N)return; sel.clearLayers(); $('q').value='';
  N.near.forEach(n=>L.polygon(n.p.w,{color:'#f2a93b',weight:n.d===0?3.5:1.8,fillColor:'#f2a93b',fillOpacity:n.d===0?.3:.08,interactive:false}).addTo(sel));
  map.fitBounds(L.latLng(N.lat,N.lng).toBounds(+$('rad').value*2.3),{animate:false});
  const here=N.near.filter(n=>n.d===0);
  let h='<div class="loc"><b>'+esc(N.label)+'</b><small>'+N.lat.toFixed(6)+', '+N.lng.toFixed(6)+' · UAT '+esc(N.uat)+'</small></div>';
  if(N.alts.length>1)h+='<div><h2>Alte rezultate</h2><div class="nb">'+N.alts.slice(1).map((a,k)=>'<button type="button" class="chip" data-alt="'+(k+1)+'" style="font-family:var(--sans);font-weight:400">'+esc(a.label)+'</button>').join('')+'</div></div>';
  h+= here.length?'':'<p class="empty">Punctul nu cade într-o parcelă înscrisă (drum, curte comună sau imobil neînscris). Mai jos sunt cele mai apropiate.</p>';
  h+='<section><h2>Parcele în rază de '+$('rad').value+' m ('+N.near.length+')</h2><div class="near">'+
     (N.near.length?N.near.slice(0,60).map(n=>'<button type="button" data-id="'+esc(n.p.id)+'" data-i="'+n.p.i+'"'+(n.d===0?' class="here"':'')+'><b>'+esc(n.p.id)+'</b><span>'+fmt(n.p.a,0)+' mp</span><span>'+(n.d===0?'în punct':fmt(n.d,0)+' m')+'</span></button>').join(''):'<p class="empty">Nicio parcelă înscrisă în rază. Mărește raza.</p>')+'</div></section>';
  h+='<p class="hint">Poziția adresei vine din OpenStreetMap și poate fi aproximativă, mai ales la numărul de casă. Pentru precizie, lipește coordonatele din Google Maps (clic dreapta pe locație → copiezi coordonatele).</p>';
  $('out').innerHTML=h;
  $('out').querySelectorAll('.near [data-id]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.id;show(b.dataset.id,+b.dataset.i,true)});
  $('out').querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const a=N.alts[+b.dataset.alt];const rest=[a].concat(N.alts.filter(x=>x!==a));goToPoint(a.lat,a.lng,a.label,rest)});
}
function geom(p){const s=p.s,n=s.length,seg=[];let per=0;for(let k=0;k<n;k++){const a=s[k],b=s[(k+1)%n],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push(d);per+=d}return{seg,per}}

function show(id,idx,fromMap){
  const list=byId.get(id), out=$('out');
  if(!list){sel.clearLayers();out.innerHTML='<div class="flag">Numărul cadastral <b>'+esc(id)+'</b> nu apare în planul pentru '+esc(U.name)+'. Verifică UAT-ul ales sau numărul din extrasul CF; imobilele foarte noi pot lipsi.</div>';return}
  const p=idx!=null?P[idx]:list[0]; cur=p; sel.clearLayers();
  const poly=L.polygon(p.w,{color:'#f2a93b',weight:3,fillColor:'#f2a93b',fillOpacity:.25}).addTo(sel);
  p.w.forEach((w,k)=>L.marker(w,{icon:L.divIcon({className:'',html:'<span class="vx">'+(k+1)+'</span>',iconSize:[22,22],iconAnchor:[11,11]}),keyboard:false,interactive:false}).addTo(sel));
  map.fitBounds(poly.getBounds(),{padding:[40,40],maxZoom:20,animate:false});
  const g=geom(p);
  let h=(lastNear&&lastNear.ids.has(p.id)?'<button type="button" class="back" id="back">← Înapoi la parcelele din jurul adresei</button>':'')+'<div class="idrow"><div><div class="lbl">Nr. cadastral · '+esc(U.name)+'</div><div class="id">'+esc(p.id)+'</div></div>'+(list.length>1?'<span class="pill">contur '+(list.indexOf(p)+1)+' din '+list.length+'</span>':'')+'</div>';
  h+='<div class="facts"><div><small>Suprafață</small><b>'+fmt(p.a,2)+' mp</b></div><div><small>Perimetru</small><b>'+fmt(g.per,2)+' m</b></div><div><small>Puncte</small><b>'+p.s.length+'</b></div></div>';
  if(p.f&&p.f.includes('shared'))h+='<div class="flag">Același contur are mai multe numere cadastrale în plan (posibilă dezmembrare sau alipire). Verifică în extrasul CF.</div>';
  if(list.length>1)h+='<div class="flag">Numărul apare pe mai multe contururi:<br>'+list.map((q,k)=>'<button class="chip" data-i="'+q.i+'">contur '+(k+1)+'</button>').join('')+'</div>';
  h+='<section><h2>Inventar de coordonate</h2><div class="seg" role="group" aria-label="Sistem de coordonate"><button type="button" data-m="s" aria-pressed="'+(mode==='s')+'">Stereo 70</button><button type="button" data-m="w" aria-pressed="'+(mode==='w')+'">GPS (WGS84)</button></div><div class="tw"><table><thead><tr><th>Pct.</th>'+
     (mode==='s'?'<th>X [m]</th><th>Y [m]</th>':'<th>Latitudine</th><th>Longitudine</th>')+'<th>D(i,i+1) [m]</th></tr></thead><tbody>'+
     p.s.map((s,k)=>'<tr><td>'+(k+1)+'</td>'+(mode==='s'?'<td>'+s[1].toFixed(3)+'</td><td>'+s[0].toFixed(3)+'</td>':'<td>'+p.w[k][0].toFixed(7)+'</td><td>'+p.w[k][1].toFixed(7)+'</td>')+'<td>'+g.seg[k].toFixed(3)+'</td></tr>').join('')+
     '</tbody><tfoot><tr><td colspan="4" style="text-align:left">S = '+fmt(p.a,2)+' mp &nbsp; P = '+fmt(g.per,3)+' m</td></tr></tfoot></table></div></section>';
  const c=poly.getBounds().getCenter();
  h+='<div class="actions"><button type="button" class="btn2" id="cp">Copiază tabelul</button><button type="button" class="btn2" id="kml">Descarcă KML</button><button type="button" class="btn2" id="gj">Descarcă GeoJSON</button><a class="btn2 navy" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+c.lat.toFixed(7)+','+c.lng.toFixed(7)+'">Google Maps →</a></div>';
  h+='<section><h2>Vecini ('+p.n.length+')</h2><div class="nb">'+(p.n.length?p.n.map(n=>'<button type="button" class="chip" data-id="'+esc(n)+'">'+esc(n)+'</button>').join(''):'<p class="empty">Niciun imobil înscris lipit de contur (drum, parcelă neînscrisă sau limită de UAT).</p>')+'</div></section>';
  out.innerHTML=h;
  out.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;show(p.id,p.i)});
  out.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.id;show(b.dataset.id,null,false);scrollToMap()});
  out.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>show(p.id,+b.dataset.i));
  if($('back'))$('back').onclick=()=>renderNear();
  $('cp').onclick=copy;
  $('kml').onclick=()=>dl(p.id+'_'+U.key+'.kml','application/vnd.google-earth.kml+xml',kml(p));
  $('gj').onclick=()=>dl(p.id+'_'+U.key+'.geojson','application/geo+json',JSON.stringify(gjson(p)));
  history.replaceState(null,'','#'+U.key+'-'+p.id);
  if(fromMap&&matchMedia('(max-width:820px)').matches)out.scrollIntoView({behavior:'smooth',block:'start'});
}
function scrollToMap(){if(matchMedia('(max-width:820px)').matches)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth',block:'start'})}
function copy(){
  const p=cur,g=geom(p);
  const rows=['Pct.\tX [m]\tY [m]\tLatitudine\tLongitudine\tD(i,i+1) [m]'].concat(p.s.map((s,k)=>[k+1,s[1].toFixed(3),s[0].toFixed(3),p.w[k][0].toFixed(7),p.w[k][1].toFixed(7),g.seg[k].toFixed(3)].join('\t')));
  rows.push('S = '+fmt(p.a,2)+' mp\tP = '+fmt(g.per,3)+' m');
  const txt=rows.join('\n');
  const fb=()=>{const t=document.createElement('textarea');t.value=txt;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{document.execCommand('copy');toast('Tabel copiat')}catch(e){toast('Copierea nu e permisă în acest browser')}t.remove()};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Tabel copiat. Lipește-l în Excel sau Word.')).catch(fb);else fb();
}
function gjson(p){const r=p.w.map(w=>[w[1],w[0]]);r.push(r[0]);return{type:'FeatureCollection',features:[{type:'Feature',properties:{nr_cadastral:p.id,uat:U.name,suprafata_mp:p.a,stereo70:p.s.map(s=>({X:s[1],Y:s[0]}))},geometry:{type:'Polygon',coordinates:[r]}}]}}
function kml(p){
  const r=p.w.concat([p.w[0]]).map(w=>w[1]+','+w[0]+',0').join(' ');
  const pts=p.w.map((w,k)=>'<Placemark><name>'+(k+1)+'</name><description>X='+p.s[k][1].toFixed(3)+' Y='+p.s[k][0].toFixed(3)+'</description><Point><coordinates>'+w[1]+','+w[0]+',0</coordinates></Point></Placemark>').join('');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Nr. cad. '+p.id+' – '+U.name+'</name><Style id="p"><LineStyle><color>ff3ba9f2</color><width>3</width></LineStyle><PolyStyle><color>403ba9f2</color></PolyStyle></Style><Placemark><name>Nr. cad. '+p.id+' – '+p.a+' mp</name><styleUrl>#p</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>'+r+'</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>'+pts+'</Document></kml>';
}
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

const q=$('q'),sugg=$('sugg');
q.addEventListener('input',()=>{
  const v=q.value.replace(/\D/g,'');sugg.innerHTML='';
  if(v.length<3||!U)return;
  ids.filter(i=>i.startsWith(v)).slice(0,10).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=i;b.onclick=()=>{q.value=i;sugg.innerHTML='';show(i);scrollToMap()};sugg.append(b)});
});
$('f').addEventListener('submit',e=>{e.preventDefault();sugg.innerHTML='';
  if(searchMode==='adr'){$('addr').blur();addrSearch($('addr').value.trim());return}
  q.blur();const v=q.value.trim();if(!v)return;
  if(!U){$('out').innerHTML='<div class="flag">Alege întâi localitatea (UAT) din listă sau de pe hartă. Numerele cadastrale se repetă de la o localitate la alta.</div>';$('uatSel').focus();return}
  lastNear=null;locLayer.clearLayers();
  (async()=>{
    if(!byId.has(v)&&U.group){for(const s of UATS.filter(x=>x.group===U.group&&x.key!==U.key)){const D=await getData(s);
      if(D&&D.parcels.some(p=>p.id===v)){await loadUat(s.key);toast('Numărul '+v+' e în '+s.name+'. Am schimbat localitatea.');break}}}
    show(v);history.replaceState(null,'','#'+U.key+'-'+v);scrollToMap()})();
});
function setMode(m){searchMode=m;$('tabCad').setAttribute('aria-pressed',m==='cad');$('tabAdr').setAttribute('aria-pressed',m==='adr');$('modeCad').hidden=m!=='cad';$('modeAdr').hidden=m!=='adr';sugg.innerHTML='';(m==='cad'?q:$('addr')).focus()}
$('tabCad').onclick=()=>setMode('cad');$('tabAdr').onclick=()=>setMode('adr');
$('rad').onchange=()=>{if(lastNear)goToPoint(lastNear.lat,lastNear.lng,lastNear.label,lastNear.alts)};
$('uatSel').addEventListener('change',async e=>{if(!e.target.value)return;lastNear=null;locLayer.clearLayers();await loadUat(e.target.value);history.replaceState(null,'','#'+U.key);const v=q.value.trim();if(v&&byId.has(v))show(v)});

(async()=>{
  const m=decodeURIComponent(location.hash.slice(1)).match(/^([a-z-]+?)(?:-(\d+))?$/);
  drawHulls();
  if(m&&UATS.some(u=>u.key===m[1])){await loadUat(m[1]);if(m[2]){q.value=m[2];show(m[2])}}
  else{map.fitBounds(L.featureGroup(hullL.getLayers()).getBounds(),{animate:false});
    $('hint').textContent=UATS.length+' localități, '+UATS.reduce((s,u)=>s+u.n,0).toLocaleString('ro-RO')+' imobile. Alege localitatea din listă sau de pe hartă.';
    $('foot').textContent='Sursă: planuri cadastrale BCPI Timișoara (strat ImobileE3). Informațiile au caracter orientativ și nu înlocuiesc extrasul de carte funciară sau documentația cadastrală.';
    $('out').innerHTML='<p class="empty">Alege localitatea din listă sau dă clic pe ea pe hartă, apoi caută numărul cadastral. Poți căuta și după adresă, fără să alegi localitatea.</p>'}
})();
